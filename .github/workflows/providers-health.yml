name: Providers Health Check

on:
  schedule:
    # Daily at 06:00 UTC. On failure, GitHub emails the repo owner per their
    # notification settings (Settings → Notifications → Actions).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run provider health checks against live APIs
        run: pytest live_tests/ -v --tb=short
